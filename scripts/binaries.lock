# Pinned tool downloads for the bundled yt-dlp, ffmpeg, ffprobe and Deno.
#
# Every build fetches exactly these files and refuses any whose SHA-256 doesn't
# match, so a compromised mirror or a silently replaced "latest" can't end up in
# a release. Each hash here was checked against the publisher's own checksum
# file when it was pinned (yt-dlp's SHA2-256SUMS, Deno's .sha256sum, Martin
# Riedl's .sha256).
#
# Don't edit by hand. Bump everything to the latest releases with:
#     bash scripts/pin-binaries.sh
# yt-dlp needs bumping for every release: YouTube starts refusing versions a few
# months old (HTTP 403), and package-app.sh warns once the pin is 60 days old.
#
# Sourced by scripts/tools.sh. Plain shell assignments only.

